<div class="container">
    <mat-sidenav-container class="sidenav-container">
        <mat-sidenav mode="side" position="end" opened class="mat-sidenav">
            <div class="profile-container">
                <img src="./../../../../assets/Captura.JPG" alt="Profile Image" class="profile-image">
                <h2 class="profile-name">EVENTGLOBAL</h2>
                <div class="buttons-container">
                    <button mat-button (click)="setActiveSection('misdatospersonales')">MIS DATOS PERSONALES</button>
                    <button mat-button (click)="setActiveSection('ubicacion')">MI UBICACIÓN</button>
                    <button mat-button (click)="setActiveSection('eventosnaturales')">EVENTOS NATURALES</button>
                    <button mat-button (click)="setActiveSection('userlist')">VER PERFIL</button>
                    <button mat-button (click)="setActiveSection('logout')">Cerrar Sesión</button>
                </div>
            </div>
        </mat-sidenav>
        <mat-sidenav-content>
            <div *ngIf="activeSection === 'ubicacion'" class="ratio">
                <app-ubicacion></app-ubicacion>
            </div>

            <div *ngIf="activeSection === 'eventosnaturales'">
                <app-eventos-destacados></app-eventos-destacados>
            </div>
            <div *ngIf="activeSection === 'userlist'">
                <app-user-list></app-user-list>
            </div>
            <div *ngIf="activeSection === 'misdatospersonales'">
                <h1 class="form-title">COLOCA TUS DATOS COMPLETOS</h1>
                <form [formGroup]="userForm" class="form-container">
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Correo Gmail</mat-label>
                        <input matInput placeholder="Correo Gmail" formControlName="email" type="email">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Contraseña</mat-label>
                        <input matInput placeholder="Contraseña" formControlName="password" type="password">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Nombre y Apellidos</mat-label>
                        <input matInput placeholder="Nombre y Apellidos" formControlName="fullName">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Municipio</mat-label>
                        <input matInput placeholder="Domicilio" formControlName="municipality">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Calle</mat-label>
                        <input matInput placeholder="Calle" formControlName="street">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Colonia</mat-label>
                        <input matInput placeholder="Colonia" formControlName="neighborhood">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Número Interior</mat-label>
                        <input matInput placeholder="Número Interior" formControlName="interiorNumber">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Número Exterior</mat-label>
                        <input matInput placeholder="Número Exterior" formControlName="exteriorNumber">
                    </mat-form-field>
                    <mat-form-field appearance="fill" class="full-width">
                        <mat-label>Código Postal</mat-label>
                        <input matInput placeholder="Código Postal" formControlName="postalCode">
                    </mat-form-field>
                    <button mat-raised-button color="primary" type="button" (click)="saveUser()">Guardar</button>

                </form>
            </div>

            <div *ngIf="activeSection === ''" class="welcome-section">
                <h1>Bienvenido al perfil</h1>
                <p>Selecciona una opción del menú .</p>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
