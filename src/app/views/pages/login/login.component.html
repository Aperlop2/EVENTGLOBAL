<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center justify-content-center" style="background-image: url('./../../../../assets/fondo.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <c-container>
        <c-row class="justify-content-center">
            <c-col lg="6" md="8" xl="5">
                <c-card-group>
                    <c-card class="p-4 rounded-0 shadow-lg">
                        <c-card-body>
                            <form cForm>
                                <h1 class="mb-4">
                                    <a routerLink="/inicio">
                                        <mat-icon arial-hidden="false" arial-label="Login back" fontIcon="arrow_back"></mat-icon>
                                    </a>
                                    iniciar secion</h1>
                                <!-- Sección de mensajes -->
                                @if (message) {
                                <div class="alert alert-{{type}} mb-4" role="alert">
                                    {{message}}
                                </div>
                                }
                                <!--------------------------------->
                                <p class="text-body-secondary mb-4">Iniciar sesión en su cuenta</p>
                                <c-input-group class="mb-3">
                                    <span cInputGroupText>
                      <svg cIcon name="cilUser"></svg>
                    </span>
                                    <input autoComplete="email" cFormControl placeholder="Email" name="email" [(ngModel)]="email" />
                                </c-input-group>
                                <c-input-group class="mb-4">
                                    <span cInputGroupText>
                      <svg cIcon name="cilLockLocked"></svg>
                    </span>
                                    <input autoComplete="current-password" cFormControl placeholder="Password" type="password" name="password" [(ngModel)]="password" />
                                </c-input-group>
                                <c-row>
                                    <c-col xs="6">
                                        <button cButton class="px-4 rounded-pill" style="background-color: green; color: white;" (click)="login()">
                        @if(loadinglogin){
                          <c-spinner aria-hidden="false" size="sm"></c-spinner> cargando...
                        }
                       @else {
                         Entrar
                       }
                      </button>
                                    </c-col>
                                    <c-col class="text-left" xs="6">
                                        <button [active]="true" cButton class="px-4 rounded-pill" style="background-color: green; color: white;" routerLink="/register">
                        Registrate ahora !
                      </button>
                                    </c-col>
                                </c-row>
                                <c-row class="mt-3">
                                    <c-col class="text-center">
                                        <button cButton class="px-2 rounded-pill" style="background-color: green; color: white;" (click)="toggleModal()">
                        Olvidaste tu contraseña?
                      </button>
                                    </c-col>
                                </c-row>
                            </form>
                        </c-card-body>
                    </c-card>
                </c-card-group>
            </c-col>
        </c-row>

        <!--  Modal Forgot Password -->
        <c-modal id="modalForgot" [visible]="visible" (visibleChange)="handleLiveDemoChange($event)">
            <c-modal-header>
                <h5 cModalTitle>Forgot Password</h5>
                <button (click)="toggleModal()" cButtonClose></button>
            </c-modal-header>
            <c-modal-body>
                <!-- Seccion de mensajes del modal-->
                @if (messagemodal) {
                <div class="alert alert-{{typemodal}} mb-4" role="alert">
                    {{messagemodal}}
                </div>
                }
                <!------------------->
                <input type="email" [(ngModel)]="emailforgot" name="emailforgot" placeholder="Enter your Email Address" cFormControl autoComplete="email" class="mb-4">
            </c-modal-body>
            <c-modal-footer>
                <button (click)="toggleModal()" cButton class="rounded-pill" style="background-color: green; color: white;">
            Close
          </button>
                <button cButton class="rounded-pill" style="background-color: green; color: white;" (click)="forgotpassword()">
            @if (loadingforgot) {
              <c-spinner aria-hidden="false" size="sm"></c-spinner>cargando... 
            }
            @else {
              Send Email
            }
          </button>
            </c-modal-footer>
        </c-modal>

    </c-container>
</div>
